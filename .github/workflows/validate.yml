name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check server.js
      - name: Test local receiver
        run: |
          node server.js > /tmp/extractor.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8787/health; then break; fi
            sleep 1
          done
          curl --silent --fail -X POST http://127.0.0.1:8787/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"test","messages":[{"role":"user","content":"hello"}]}' > /tmp/reply.json
          grep -q 'mock response' /tmp/reply.json
          curl --silent --fail http://127.0.0.1:8787/api/latest | grep -q '"content":"hello"'
